# Upptime (https://upptime.js.org) — the uptime monitor for every Fiopop platform.
# Checks run on GitHub Actions every 5 minutes; an outage opens an issue here,
# posts to Discord (secrets NOTIFICATION_DISCORD_WEBHOOK*), and shows on
# https://status.fiopop.com. Add a platform: one entry under `sites`.
owner: AY-Tech-Org
repo: fiopop-status

sites:
  - name: Fiopop Mass — app
    url: https://mass.fiopop.com
  - name: Fiopop Mass — API
    url: https://api.fiopop.com/health
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  # Our own cloud Management (no customers yet). The name is kept as it is:
  # Upptime files history under it, so renaming it would orphan the graphs.
  - name: Fiopop Management
    url: https://manage.fiopop.com/api/v1/health
    __dangerous__body_down_if_text_missing: '"ok":true'
  # Sanivor's own server since 2026-10-17 (manage-fiopop ADR-121/124) — the
  # Management installation a customer actually uses. Once it runs the
  # readiness fixes (manage-fiopop docs/PRODUCTION_READINESS.md), /api/v1/health
  # pings MongoDB, so a box that is up but cannot reach its data answers 503
  # and shows here as down.
  - name: Fiopop Management — Sanivor
    url: https://manage.sanivor.ch/api/v1/health
    __dangerous__body_down_if_text_missing: '"ok":true'
  # The old production address. It answers 308 to Sanivor's domain (links in
  # mails already sent), so this check follows that redirect — keep it while
  # the redirect matters; the entry above is Sanivor's real monitor.
  - name: Fiopop Management — atlas.app (until the move)
    url: https://atlas.app.fiopop.com/api/v1/health
    __dangerous__body_down_if_text_missing: '"ok":true'
  - name: Fiopop Admin console
    url: https://admin.fiopop.com/health
    __dangerous__body_down_if_text_missing: '"ok":true'
  - name: Fiopop — landing page
    url: https://fiopop.com

status-website:
  cname: status.fiopop.com
  name: Fiopop Status
  introTitle: "Fiopop platform status"
  introMessage: Live status of Fiopop Mass, Fiopop Management and fiopop.com, checked every 5 minutes.
  navbar:
    - title: Status
      href: /
    - title: fiopop.com
      href: https://fiopop.com

workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 23 * * *"
  graphs: "0 0 * * *"
  summary: "0 0 * * *"
  staticSite: "0 1 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"

i18n:
  activeIncidents: Active incidents
  allSystemsOperational: All systems operational
